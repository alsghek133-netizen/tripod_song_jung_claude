name: daily-judgment

on:
  schedule:
    # 평일 21:30 UTC = 한국시간 화~토 06:30 (미국장 마감 후)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:   # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python tripod.py
      - name: 변경됐을 때만 저장
        run: |
          git config user.name "tripod-bot"
          git config user.email "tripod-bot@users.noreply.github.com"
          git add index.html data.json
          git diff --cached --quiet || (git commit -m "판정 $(date -u +%F)" && git push)
